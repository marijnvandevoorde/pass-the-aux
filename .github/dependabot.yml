# Dependabot configuration for the pass-the-aux repo.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Dependabot opens PRs automatically on the schedule below.
# Minor + patch updates are grouped into a single PR per ecosystem and are
# auto-merged by .github/workflows/dependabot-auto-merge.yml once checks pass.
# Major updates are intentionally left ungrouped: each gets its own PR for
# manual review and is not auto-merged.
version: 2
updates:
  # JavaScript / Node.js dependencies (package.json + package-lock.json at the repo root).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3

  # Base images in the Dockerfile at the repo root.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3

  # Images pinned in the compose files at the repo root (the dev MySQL).
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      docker-compose-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Prod is HeatWave on the 26.x Innovation track (calendar versions); Dependabot
      # still offers 9.x bumps, which would be a step back. 26.x updates keep flowing.
      - dependency-name: "mysql"
        versions: [">= 9.0, < 26.0"]
    cooldown:
      default-days: 3

  # Actions used by the workflows in .github/workflows/.
  # Grouped too: action minor/patch bumps are routine and should land on their own.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3
