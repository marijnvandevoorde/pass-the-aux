name: E2E & UI

# Heavier browser click-through (test/e2e). Manual-only — not a merge
# gate. Trigger from the Actions tab ("Run workflow") on any branch.
on:
  workflow_dispatch:

jobs:
  e2e:
    name: e2e click-through
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
