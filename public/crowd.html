<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#07090e" />
  <title>Pass the Aux — Request</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/mobile-styles.css?v={{APP_VERSION}}" />
  <link rel="stylesheet" href="/crowd-styles.css?v={{APP_VERSION}}" />
</head>
<body>
<div class="crowd-screen">

  <header class="crowd-header">
    <div class="app-logo"><img src="/logo.png" alt="Pass the Aux" /></div>
    <div class="brand-block">
      <div class="app-title">Pass the Aux</div>
      <div class="session-meta">
        <span class="live-dot"></span>
        <span class="listeners" id="guestCount"><b>—</b> in the room</span>
      </div>
    </div>
    <button class="guest-chip" id="guestChip" title="Change name">
      <span class="guest-av" id="guestAv">?</span>
      <span class="guest-name" id="guestName">You</span>
    </button>
  </header>

  <div class="crowd-body">

    <div class="now-hero crowd" id="nowHero">
      <span class="expand-hint">
        TAP TO EXPAND
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 1.5h3v3M10.5 1.5 7 5M4.5 10.5h-3v-3M1.5 10.5 5 7"/></svg>
      </span>
      <div class="disc-wrap">
        <div class="disc"></div>
        <img class="disc-cover" id="discCover" alt="" />
        <div class="disc-shine"></div>
        <div class="disc-hole"></div>
      </div>
      <div class="now-info">
        <div class="now-title-wrap"><span class="now-title" id="nowTitle">—</span></div>
        <div class="now-artist" id="nowArtist"></div>
        <div class="chip-row">
          <span class="key-chip" id="nowKeyChip"><span class="key-dot"></span><span id="nowKeyLabel">—</span></span>
          <span class="bpm-chip" id="nowBpmChip"><b id="nowBpmVal">—</b> BPM</span>
        </div>
      </div>
      <div class="wave-wrap">
        <span class="wave-time" id="timeElapsed">0:00</span>
        <div class="wave" id="wave"></div>
        <span class="wave-time" id="timeRemain"></span>
      </div>
      <div class="requested-by" id="reqBy" style="grid-column:1/-1"></div>
    </div>

    <div class="workspace">
      <div class="tab-bar">
        <button class="tab-btn active" id="tabQueue">Up Next <span class="tab-count" id="queueCount">0</span></button>
        <button class="tab-btn" id="tabCrate">The Crate</button>
      </div>

      <div class="tab-panels">
        <div class="tab-panel active" id="panelQueue">
          <div class="queue-list" id="queueList"></div>
          <div class="queue-list" style="padding-top:0">
            <div class="played-head" id="playedHead">
              <span class="ph-label">ALREADY PLAYED</span>
              <span class="ph-line"></span>
              <span class="ph-chev"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5l4 4 4-4"/></svg></span>
            </div>
            <div class="played-body" id="playedBody"></div>
          </div>
          <button class="fab" id="fabCrate">
            <svg width="15" height="15" viewBox="0 0 14 14" fill="none"><path d="M7 1.5v11M1.5 7h11" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
            Request a track
          </button>
        </div>

        <div class="tab-panel" id="panelCrate">
          <div class="lib-search-wrap">
            <div class="lib-search-rel">
              <input class="lib-search" id="crateSearch" type="search" placeholder="Search the crate…" autocomplete="off" spellcheck="false" />
              <span class="search-icon"><svg width="15" height="15" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="6" cy="6" r="4.5"/><path d="M9.5 9.5l2.5 2.5"/></svg></span>
            </div>
          </div>
          <div class="crate-hint">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.5v13M3 6.5 8 1.5l5 5"/></svg>
            <span>Send the DJ a request — they'll <b>curate</b> what makes the cut.</span>
          </div>
          <div class="lib-list" id="crateList"></div>
          <div class="lib-empty" id="crateEmpty">No tracks found</div>
        </div>
      </div>

      <div class="toast-container" id="toastContainer"></div>
    </div>

  </div><!-- /.crowd-body -->

  <div class="np-full" id="npFull">
    <button class="np-collapse" id="npCollapse" aria-label="Close"></button>
    <button class="np-close" id="npClose" aria-label="Close">×</button>
    <div class="np-flag">NOW PLAYING</div>
    <div class="np-disc">
      <div class="np-shine"></div>
      <div class="np-hole"></div>
      <img class="disc-cover" id="npCover" alt="" />
    </div>
    <div class="np-title" id="npTitle">—</div>
    <div class="np-artist" id="npArtist"></div>
    <div class="np-chips">
      <span class="key-chip" id="npKeyChip"><span class="key-dot"></span><span id="npKeyLabel">—</span></span>
      <span class="bpm-chip" id="npBpmChip"><b id="npBpmVal">—</b> BPM</span>
    </div>
    <div class="np-wave" id="npWave"></div>
    <div class="np-times"><span id="npElapsed">0:00</span><span id="npRemain"></span></div>
    <div class="np-req" id="npReqBy"></div>
  </div>

  <div class="name-gate" id="nameGate">
    <div class="gate-logo"><img src="/logo.png" alt="Pass the Aux" /></div>
    <div class="gate-kicker">You're on the aux</div>
    <div class="gate-title">Pass the Aux</div>
    <div class="gate-session"><span class="live-dot"></span> Session active</div>
    <div class="gate-form">
      <label class="gate-label" for="gateInput">What should we call you?</label>
      <input class="gate-input" id="gateInput" type="text" placeholder="First name" autocomplete="given-name" maxlength="20" spellcheck="false" />
      <button class="gate-go" id="gateGo" disabled>
        Join the room
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h9M8.5 4l4 4-4 4"/></svg>
      </button>
    </div>
    <div class="gate-fine">Just a first name, so the DJ knows who's requesting. No account needed.</div>
  </div>

</div><!-- /.crowd-screen -->

<script type="module" src="/js/crowd.js?v={{APP_VERSION}}"></script>
</body>
</html>
