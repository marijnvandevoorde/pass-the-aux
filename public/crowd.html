<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <meta name="theme-color" content="#0b0b12" />
    <title>Request a track</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b12;
        --card: #16161f;
        --line: #262633;
        --ink: #f3f3fa;
        --dim: #9a9ab0;
        --accent: #ff4d6d;
        --ok: #38d39f;
        --warn: #ffcf5c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--ink);
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      }
      header {
        padding: 20px 16px 12px;
        text-align: center;
      }
      header .brand-logo {
        width: 64px;
        height: 64px;
        display: block;
        margin: 0 auto 10px;
        border-radius: 16px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      }
      header h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 0.02em;
      }
      header p {
        margin: 6px 0 0;
        color: var(--dim);
        font-size: 14px;
      }
      .powered {
        margin-top: 32px;
        text-align: center;
      }
      .powered a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--dim);
        font-size: 12px;
        letter-spacing: 0.04em;
        text-decoration: none;
        transition: color 0.15s ease, border-color 0.15s ease;
      }
      .powered a:hover {
        color: var(--ink);
        border-color: var(--accent);
      }
      .powered img {
        width: 18px;
        height: 18px;
        border-radius: 5px;
      }
      .powered strong {
        color: var(--accent);
        font-weight: 700;
      }
      #status[data-kind="warn"] {
        color: var(--warn);
      }
      #status[data-kind="ok"] {
        color: var(--ok);
      }
      .wrap {
        max-width: 560px;
        margin: 0 auto;
        padding: 0 12px 40px;
      }
      #q {
        width: 100%;
        padding: 14px 16px;
        font-size: 17px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        position: sticky;
        top: 8px;
      }
      #q:focus {
        outline: 2px solid var(--accent);
      }
      #q:disabled {
        opacity: 0.5;
      }
      section {
        margin-top: 18px;
      }
      h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--dim);
        margin: 0 0 8px 2px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        margin-bottom: 8px;
      }
      .meta {
        min-width: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .meta strong {
        font-size: 15px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .meta span {
        font-size: 13px;
        color: var(--dim);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      button.q {
        flex: none;
        padding: 11px 18px;
        font-size: 15px;
        font-weight: 600;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        min-width: 92px;
      }
      button.q:active {
        transform: scale(0.96);
      }
      button.q.used,
      button.q:disabled {
        background: #2c2c3a;
        color: var(--dim);
        cursor: default;
      }
      .empty {
        color: var(--dim);
        font-size: 14px;
        padding: 4px 2px;
      }
      #modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.62);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s ease;
        z-index: 10;
      }
      #modal.show {
        opacity: 1;
        pointer-events: auto;
      }
      #modal .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 24px 22px;
        max-width: 360px;
        text-align: center;
        transform: translateY(10px);
        transition: transform 0.18s ease;
      }
      #modal.show .card {
        transform: translateY(0);
      }
      #modal .emoji {
        font-size: 34px;
      }
      #modal h3 {
        margin: 10px 0 6px;
        font-size: 18px;
      }
      #modal p {
        margin: 0 0 18px;
        color: var(--dim);
        font-size: 14px;
      }
      #modal button {
        padding: 12px 26px;
        font-size: 15px;
        font-weight: 600;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translate(-50%, 0);
        visibility: hidden;
        opacity: 0;
        background: var(--ok);
        color: #04130d;
        font-weight: 600;
        padding: 12px 20px;
        border-radius: 999px;
        max-width: 90vw;
        text-align: center;
        /* visibility hidden is delayed so the fade-out plays before disappearing */
        transition: opacity 0.22s ease, visibility 0s linear 0.22s;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      }
      #toast[data-kind="warn"] {
        background: var(--warn);
        color: #1c1500;
      }
      #toast.show {
        visibility: visible;
        opacity: 1;
        transition: opacity 0.22s ease, visibility 0s linear 0s;
      }
    </style>
  </head>
  <body>
    <header>
      <img class="brand-logo" src="/logo.png" alt="Pass the Aux" />
      <h1>Request a track</h1>
      <p id="status" data-kind="ok">Connecting…</p>
    </header>
    <div class="wrap">
      <input
        id="q"
        type="search"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="Filter the crate…"
        aria-label="Filter the crate, press Enter to search the web"
      />
      <div id="results">
        <section id="sec-local">
          <h2>From the crate</h2>
          <div id="local">
            <p class="empty">Loading the crate…</p>
          </div>
        </section>
        <section id="sec-remote" hidden>
          <h2>From the web</h2>
          <div id="remote">
            <p class="empty">Press Enter to search the web.</p>
          </div>
        </section>
      </div>
      <footer class="powered">
        <a
          href="https://github.com/marijnvandevoorde/pass-the-aux"
          target="_blank"
          rel="noopener"
        >
          <img src="/logo.png" alt="" />
          Powered by <strong>Pass&nbsp;the&nbsp;Aux</strong>
        </a>
      </footer>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <div class="card">
        <div class="emoji">🔁🚫</div>
        <h3 id="m-title">Already played</h3>
        <p id="m-body"></p>
        <button id="m-ok" type="button">Got it</button>
      </div>
    </div>
    <script type="module" src="js/crowd.js"></script>
  </body>
</html>
