<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#07090e" />
  <title>Pass the Aux</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/mobile-styles.css?v={{APP_VERSION}}" />
</head>
<body>
<!-- Two audio decks for crossfade -->
<audio id="deckA" hidden></audio>
<audio id="deckB" hidden></audio>

<div class="phone-frame">
  <div class="dynamic-island"></div>
  <div class="screen">

    <div class="status-bar">
      <div class="status-time" id="statusTime">9:18</div>
      <div class="status-icons">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="0.5"/><rect x="4.5" y="5.5" width="3" height="6.5" rx="0.5"/><rect x="9" y="3" width="3" height="9" rx="0.5"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" opacity="0.35"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="currentColor"><rect x="0" y="1" width="21" height="10" rx="3" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="22" y="3.8" width="2" height="4.4" rx="1"/><rect x="1.5" y="2.5" width="16" height="7" rx="2"/></svg>
      </div>
    </div>

    <div class="app-header">
      <div class="app-logo"><img src="/logo.png" alt="Pass the Aux" /></div>
      <div class="brand-block">
        <div class="app-title">Pass the Aux</div>
        <div class="session-meta">
          <span class="live-dot" id="liveDot" style="display:none"></span>
          <span class="listeners" id="guestCount">Starting…</span>
        </div>
      </div>
      <button class="share-btn" id="shareBtn" style="display:none">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="3.5" r="2"/><circle cx="4" cy="8" r="2"/><circle cx="12" cy="12.5" r="2"/><path d="M5.8 7 10.2 4.5M5.8 9 10.2 11.5"/></svg>
        Invite
      </button>
    </div>

    <div class="now-hero" id="nowHero">
      <!-- Tap hero to expand fullscreen -->
      <span class="expand-hint" id="npExpandBtn">
        TAP TO EXPAND
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 1.5h3v3M10.5 1.5 7 5M4.5 10.5h-3v-3M1.5 10.5 5 7"/></svg>
      </span>
      <div class="disc-wrap">
        <div class="disc"></div>
        <img class="disc-cover" id="discCover" alt="" />
        <div class="disc-shine"></div>
        <div class="disc-hole"></div>
      </div>
      <div class="now-info">
        <div class="now-title-wrap"><span class="now-title" id="nowTitle">—</span></div>
        <div class="now-artist" id="nowArtist">Add a track to begin</div>
        <div class="chip-row">
          <span class="key-chip" id="nowKeyChip"><span class="key-dot"></span><span id="nowKeyLabel">—</span></span>
          <span class="bpm-chip" id="nowBpmChip"><b id="nowBpmVal">—</b> BPM</span>
        </div>
        <div class="now-req" id="nowReq"></div>
      </div>

      <div class="wave-wrap">
        <span class="wave-time" id="timeElapsed">0:00</span>
        <div class="wave" id="wave"></div>
        <span class="wave-time" id="timeRemain">-0:00</span>
      </div>

      <div class="transport">
        <button class="btn-play" id="playBtn" aria-label="Play / Pause">
          <svg id="playIcon" width="17" height="17" viewBox="0 0 17 17">
            <path d="M3 2l11 6.5L3 15V2z" fill="currentColor"/>
          </svg>
          <span class="play-label" id="playLabel">PAUSED</span>
        </button>
        <div class="skip-wrap" id="skipWrap" title="Fade to next">
          <svg class="skip-ring-svg" viewBox="0 0 50 50">
            <circle class="skip-ring-track" cx="25" cy="25" r="22"/>
            <circle class="skip-ring-fill" id="skipRing" cx="25" cy="25" r="22"/>
          </svg>
          <div class="skip-bg"></div>
          <div class="skip-flash" id="skipFlash"></div>
          <div class="skip-inner">
            <svg class="skip-icon" width="16" height="14" viewBox="0 0 16 14" fill="currentColor" aria-hidden="true">
              <path d="M1 1.4 9.2 6.3a.8.8 0 0 1 0 1.4L1 12.6A.8.8 0 0 1 0 12V2a.8.8 0 0 1 1-.6z"/>
              <rect x="11.8" y="1" width="2.4" height="12" rx="1.2"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <div class="workspace">
      <div class="tab-bar">
        <button class="tab-btn active" id="tabQueue">Up Next <span class="tab-count" id="queueCount">0</span></button>
        <button class="tab-btn" id="tabLibrary">Library</button>
      </div>

      <div class="tab-panels">
        <div class="tab-panel active" id="panelQueue">
          <div class="queue-toolbar">
            <span class="ondeck-flag">▸ MIXING INTO DECK</span>
            <button class="clear-btn" id="resetBtn" aria-label="Reset played history" title="Reset played history">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8a5.5 5.5 0 1 1 1.7 4"/><path d="M2 11.2V7.8h3.4"/></svg>
            </button>
            <button class="clear-btn" id="clearBtn" aria-label="Clear queue" title="Clear queue">
              <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 4h9M5.5 4V2.5h3V4M4 4l.6 8h4.8L10 4"/></svg>
            </button>
          </div>
          <div class="queue-list" id="queueList"></div>
          <div class="queue-empty" id="queueEmpty">
            <div class="empty-text">Queue is empty<br>Add tracks from the Library</div>
          </div>
          <button class="fab" id="fabLibrary">
            <svg width="15" height="15" viewBox="0 0 14 14" fill="none"><path d="M7 1.5v11M1.5 7h11" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
            Add track
          </button>
        </div>

        <div class="tab-panel" id="panelLibrary">
          <div class="lib-search-wrap">
            <div class="lib-search-rel">
              <input class="lib-search" id="librarySearch" type="search" placeholder="Search the crate…" autocomplete="off" spellcheck="false" />
              <span class="search-icon"><svg width="15" height="15" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="6" cy="6" r="4.5"/><path d="M9.5 9.5l2.5 2.5"/></svg></span>
            </div>
          </div>
          <div class="lib-list" id="libraryList"></div>
          <div class="lib-empty" id="libraryEmpty">No tracks found</div>
        </div>
      </div>

      <div class="toast-container" id="toastContainer"></div>
    </div>

    <!-- Fullscreen now-playing (expand on tap) -->
    <div class="np-full" id="npFull">
      <button class="np-collapse" id="npCollapse" aria-label="Close"></button>
      <button class="np-close" id="npClose" aria-label="Close">×</button>
      <div class="np-flag">NOW PLAYING</div>
      <div class="np-disc">
        <div class="np-shine"></div>
        <div class="np-hole"></div>
        <img class="disc-cover" id="npCover" alt="" />
      </div>
      <div class="np-title" id="npTitle">—</div>
      <div class="np-artist" id="npArtistFull"></div>
      <div class="np-chips">
        <span class="key-chip" id="npKeyChip"><span class="key-dot"></span><span id="npKeyLabel">—</span></span>
        <span class="bpm-chip" id="npBpmChip"><b id="npBpmVal">—</b> BPM</span>
      </div>
      <div class="np-wave" id="npWave"></div>
      <div class="np-times"><span id="npElapsed">0:00</span><span id="npRemain">-0:00</span></div>
      <div class="np-req" id="npReq"></div>
      <!-- Transport in fullscreen -->
      <div class="transport np-transport-row">
        <button class="btn-play" id="npPlayBtn" aria-label="Play / Pause">
          <svg id="npPlayIcon" width="17" height="17" viewBox="0 0 17 17">
            <path d="M3 2l11 6.5L3 15V2z" fill="currentColor"/>
          </svg>
          <span class="play-label" id="npPlayLabel">PAUSED</span>
        </button>
        <div class="skip-wrap" id="npSkipWrap" title="Fade to next">
          <svg class="skip-ring-svg" viewBox="0 0 50 50">
            <circle class="skip-ring-track" cx="25" cy="25" r="22"/>
            <circle class="skip-ring-fill" id="npSkipRing" cx="25" cy="25" r="22"/>
          </svg>
          <div class="skip-bg"></div>
          <div class="skip-flash" id="npSkipFlash"></div>
          <div class="skip-inner">
            <svg class="skip-icon" width="16" height="14" viewBox="0 0 16 14" fill="currentColor" aria-hidden="true">
              <path d="M1 1.4 9.2 6.3a.8.8 0 0 1 0 1.4L1 12.6A.8.8 0 0 1 0 12V2a.8.8 0 0 1 1-.6z"/>
              <rect x="11.8" y="1" width="2.4" height="12" rx="1.2"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <div class="qr-overlay" id="qrOverlay">
      <button class="qr-close" id="qrClose">×</button>
      <div class="qr-card">
        <div class="qr-title">Pass the Aux</div>
        <div class="qr-box" id="qrBox"></div>
        <div class="qr-sub">Scan to join the session<br><b id="qrUrl"></b></div>
        <label class="qr-toggle-row">
          <span class="qr-toggle-label">Show queue to crowd</span>
          <button class="qr-toggle" id="upNextToggle" role="switch" aria-checked="false">
            <span class="qr-toggle-thumb"></span>
          </button>
        </label>
        <div class="qr-toggle-hint" id="upNextHint">Guests can see Up Next &amp; vote</div>
      </div>
    </div>

    <div class="home-indicator"><div class="home-bar"></div></div>
  </div>
</div>

<script type="module" src="/js/mobile-dj.js?v={{APP_VERSION}}"></script>
</body>
</html>
