 from<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pass the Aux — Party Mode Mockup</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #090b11;
  --bg-sunk:   #040509;
  --surface:   #161a26;
  --surface-2: #1f2433;
  --line:      #2b3145;
  --line-soft: #1e2331;
  --text:      #eef1f8;
  --dim:       #8d95a9;
  --faint:     #5a6175;
  --accent:    #38e0c4;
  --accent-deep: #04201b;
  --accent-b:  #ff8a3d;
  --danger:    #e0532b;
  --warn:      #ffd34d;
  --radius:    14px;
  --phone-w:   390px;
  --phone-h:   844px;
}

/* ── Desktop scaffold ── */
body {
  background: #060609;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.desktop-label {
  position: fixed;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  color: #3a3f52;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  pointer-events: none;
  white-space: nowrap;
}

/* ── iPhone bezel ── */
.phone-frame {
  width: var(--phone-w);
  height: var(--phone-h);
  background: #1a1a1f;
  border-radius: 52px;
  box-shadow:
    0 0 0 1px #2e2e38,
    0 0 0 9px #111116,
    0 0 0 11px #2a2a34,
    0 60px 120px rgba(0,0,0,0.85);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

/* Dynamic island */
.dynamic-island {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 34px;
  background: #000;
  border-radius: 20px;
  z-index: 100;
}

/* Screen */
.screen {
  position: absolute;
  inset: 0;
  border-radius: 52px;
  background: var(--bg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* Status bar */
.status-bar {
  height: 54px;
  display: flex;
  align-items: flex-end;
  padding: 0 28px 8px;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 10;
}
.status-time {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.3px;
}
.status-icons {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text);
}
.status-icons svg { display: block; }

/* App header */
.app-header {
  height: 48px;
  background: var(--surface);
  border-bottom: 1px solid var(--line-soft);
  display: flex;
  align-items: center;
  padding: 0 16px;
  flex-shrink: 0;
  gap: 10px;
  z-index: 10;
}
.app-logo {
  width: 30px;
  height: 30px;
  flex-shrink: 0;
  border-radius: 8px;
  overflow: hidden;
}
.app-logo img { width: 100%; height: 100%; display: block; object-fit: cover; }
.app-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.2px;
  flex: 1;
}
.share-btn {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  background: var(--surface-2, #1f2433);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 5px 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  -webkit-tap-highlight-color: transparent;
}
.share-btn:active { opacity: 0.7; }

/* ── QR overlay ── */
.qr-overlay {
  position: absolute;
  inset: 0;
  z-index: 50;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  padding: 32px 24px calc(32px + env(safe-area-inset-bottom));
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(.32,0,.2,1);
}
.qr-overlay.open { transform: translateY(0); }
.qr-close {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--surface-2, #1f2433);
  border: 1px solid var(--line);
  color: var(--dim);
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.qr-close:active { opacity: 0.7; }
.qr-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--dim);
}
.qr-box {
  background: #fff;
  border-radius: 16px;
  padding: 16px;
  width: min(260px, 70vw);
  height: min(260px, 70vw);
}
.qr-box svg { width: 100%; height: 100%; display: block; }
.qr-url {
  font-size: 13px;
  color: var(--dim);
  text-align: center;
  word-break: break-all;
  max-width: 280px;
}
.qr-url strong { color: var(--text); }
.qr-hint {
  font-size: 12px;
  color: var(--faint);
  text-align: center;
}

/* ── Now Playing bar ── */
.now-playing-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  position: relative;
  z-index: 9;
}

/* Pulsing dot */
.pulse-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
  position: relative;
  transition: background 0.3s;
}
.pulse-dot.playing::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  animation: pulse-ring 1.4s ease-out infinite;
}
.pulse-dot.paused {
  background: var(--faint);
}

@keyframes pulse-ring {
  0%   { transform: scale(0.7); opacity: 0.8; }
  70%  { transform: scale(1.8); opacity: 0; }
  100% { transform: scale(1.8); opacity: 0; }
}

/* Track info */
.track-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow: hidden;
}
.track-name-wrap {
  overflow: hidden;
  white-space: nowrap;
  mask-image: linear-gradient(to right, #000 80%, transparent 100%);
}
.track-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  display: inline-block;
  animation: marquee 14s linear infinite;
  animation-play-state: running;
  padding-right: 40px;
}
.track-name.paused-anim {
  animation-play-state: paused;
}
@keyframes marquee {
  0%   { transform: translateX(0); }
  30%  { transform: translateX(0); }
  70%  { transform: translateX(-60%); }
  100% { transform: translateX(0); }
}

.track-meta {
  display: flex;
  align-items: center;
  gap: 6px;
}
.track-artist {
  font-size: 11px;
  color: var(--dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 110px;
}
.bpm-badge {
  font-size: 10px;
  font-weight: 700;
  color: var(--accent-b);
  background: rgba(255, 138, 61, 0.12);
  border-radius: 4px;
  padding: 1px 5px;
  letter-spacing: 0.04em;
  flex-shrink: 0;
}

/* Controls */
.np-controls {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.btn-play {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--accent);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.1s, background 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.btn-play:active { transform: scale(0.9); }
.btn-play svg { display: block; }

/* Skip button with ring */
.skip-wrap {
  position: relative;
  width: 46px;
  height: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
.skip-ring-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
  pointer-events: none;
}
.skip-ring-track {
  fill: none;
  stroke: var(--line);
  stroke-width: 2.5;
}
.skip-ring-fill {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-dasharray: 125.66; /* 2π × 20 */
  stroke-dashoffset: 125.66;
  transition: stroke 0.1s;
}
.skip-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0px;
  pointer-events: none;
}
.skip-icon {
  font-size: 14px;
  color: var(--dim);
  line-height: 1;
}
.skip-label {
  font-size: 8px;
  font-weight: 700;
  color: var(--faint);
  letter-spacing: 0.06em;
  line-height: 1;
}
.skip-wrap.firing .skip-ring-fill {
  stroke: #fff;
}
.skip-flash {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0;
  pointer-events: none;
}
.skip-flash.flash-anim {
  animation: skip-flash 0.3s ease-out forwards;
}
@keyframes skip-flash {
  0%   { opacity: 0.9; transform: scale(0.8); }
  100% { opacity: 0;   transform: scale(1.5); }
}

/* ── Workspace ── */
.workspace {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* Tab bar */
.tab-bar {
  display: flex;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.tab-btn {
  flex: 1;
  height: 42px;
  border: none;
  background: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: var(--faint);
  border-bottom: 2px solid transparent;
  transition: color 0.2s, border-color 0.2s;
  -webkit-tap-highlight-color: transparent;
  letter-spacing: 0.01em;
}
.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* Tab panels */
.tab-panels {
  flex: 1;
  overflow: hidden;
  position: relative;
}
.tab-panel {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  opacity: 0;
  pointer-events: none;
  transform: translateY(8px);
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.tab-panel.active {
  opacity: 1;
  pointer-events: all;
  transform: translateY(0);
}

/* Scrollbar */
.tab-panel::-webkit-scrollbar { width: 3px; }
.tab-panel::-webkit-scrollbar-track { background: transparent; }
.tab-panel::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

/* ── Queue tab ── */
.queue-header {
  display: flex;
  align-items: center;
  padding: 12px 14px 10px;
  gap: 8px;
}
.queue-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--dim);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  flex: 1;
}
.count-badge {
  font-size: 11px;
  font-weight: 600;
  color: var(--faint);
}

.automix-btn {
  height: 26px;
  padding: 0 10px;
  border-radius: 13px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-size: 11px;
  font-weight: 700;
  color: var(--faint);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
  letter-spacing: 0.03em;
  white-space: nowrap;
}
.automix-btn.on {
  background: rgba(56, 224, 196, 0.12);
  border-color: rgba(56, 224, 196, 0.35);
  color: var(--accent);
}
.automix-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}

.clear-btn {
  height: 26px;
  padding: 0 9px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: none;
  font-size: 11px;
  font-weight: 600;
  color: var(--faint);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: color 0.15s, border-color 0.15s;
}
.clear-btn:active { color: var(--danger); border-color: var(--danger); }

/* Queue list */
.queue-list {
  padding: 0 14px 100px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.queue-item {
  display: flex;
  align-items: center;
  background: var(--surface);
  border-radius: 10px;
  padding: 10px 10px 10px 12px;
  gap: 10px;
  border: 1px solid var(--line-soft);
  transition: opacity 0.3s;
}
.queue-item.removing {
  opacity: 0;
  transform: translateX(30px);
  transition: opacity 0.2s, transform 0.2s;
}
.queue-num {
  font-size: 11px;
  font-weight: 600;
  color: var(--faint);
  min-width: 18px;
  text-align: center;
}
.queue-item-info {
  flex: 1;
  min-width: 0;
}
.queue-item-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.queue-item-bpm {
  font-size: 10px;
  color: var(--faint);
  margin-top: 1px;
}
.drag-handle {
  color: var(--faint);
  font-size: 14px;
  padding: 0 2px;
  opacity: 0.5;
  cursor: grab;
}
.remove-btn {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: none;
  background: none;
  color: var(--faint);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: color 0.15s, background 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.remove-btn:active { color: var(--danger); background: rgba(224, 83, 43, 0.12); }

/* Empty state */
.queue-empty {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 30px;
  gap: 12px;
  text-align: center;
}
.queue-empty.visible { display: flex; }
.empty-icon { font-size: 36px; opacity: 0.3; }
.empty-text {
  font-size: 13px;
  color: var(--dim);
  line-height: 1.5;
}

/* FAB */
.fab {
  position: absolute;
  bottom: 20px;
  right: 16px;
  height: 44px;
  padding: 0 18px;
  border-radius: 22px;
  background: var(--accent);
  border: none;
  color: var(--accent-deep);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 4px 20px rgba(56, 224, 196, 0.35);
  transition: transform 0.1s, box-shadow 0.2s;
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
}
.fab:active { transform: scale(0.94); box-shadow: 0 2px 10px rgba(56, 224, 196, 0.2); }

/* ── Library tab ── */
.library-search-wrap {
  padding: 10px 14px 8px;
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 5;
}
.library-search {
  width: 100%;
  height: 36px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--text);
  font-size: 13px;
  padding: 0 12px 0 36px;
  outline: none;
  transition: border-color 0.2s;
  font-family: inherit;
}
.library-search:focus { border-color: rgba(56, 224, 196, 0.4); }
.search-icon-wrap {
  position: absolute;
  left: 26px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--faint);
  pointer-events: none;
  display: flex;
}
.library-search-rel { position: relative; }

.library-list {
  padding: 0 14px 100px;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.lib-item {
  display: flex;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--line-soft);
  gap: 10px;
}
.lib-item-info {
  flex: 1;
  min-width: 0;
}
.lib-item-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lib-item-meta {
  font-size: 10px;
  color: var(--faint);
  margin-top: 2px;
}
.add-queue-btn {
  height: 28px;
  padding: 0 10px;
  border-radius: 7px;
  border: 1px solid rgba(56, 224, 196, 0.3);
  background: rgba(56, 224, 196, 0.08);
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
  font-family: inherit;
}
.add-queue-btn:active { transform: scale(0.92); background: rgba(56, 224, 196, 0.18); }
.add-queue-btn.added {
  background: rgba(56, 224, 196, 0.2);
  color: var(--accent);
}
.lib-no-results {
  text-align: center;
  color: var(--faint);
  font-size: 13px;
  padding: 40px 0;
  display: none;
}
.lib-no-results.visible { display: block; }

/* ── Toast ── */
.toast-container {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  width: 100%;
  padding: 0 16px;
}
.toast {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 14px;
  font-size: 12px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 7px;
  animation: toast-in 0.25s ease-out, toast-out 0.3s ease-in 2.2s forwards;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  white-space: nowrap;
  max-width: 280px;
}
.toast-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}
@keyframes toast-in {
  from { opacity: 0; transform: translateY(10px) scale(0.95); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes toast-out {
  from { opacity: 1; }
  to   { opacity: 0; transform: translateY(6px); }
}

/* ── Home indicator ── */
.home-indicator {
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  background: var(--bg);
}
.home-bar {
  width: 130px;
  height: 5px;
  background: rgba(255,255,255,0.18);
  border-radius: 3px;
}

/* ── Responsive: hide frame on narrow screens ── */
@media (max-width: 480px) {
  body { background: var(--bg); align-items: flex-start; }
  .desktop-label { display: none; }
  .phone-frame {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    border-radius: 0;
    box-shadow: none;
  }
  .screen { border-radius: 0; }
  .dynamic-island { display: none; }
  .status-bar { height: 44px; }
}
</style>
</head>
<body>

<div class="desktop-label">Pass the Aux — Party Mode · Mobile Mockup</div>

<div class="phone-frame">
  <div class="dynamic-island"></div>
  <div class="screen">

    <!-- Status bar -->
    <div class="status-bar">
      <div class="status-time">9:41</div>
      <div class="status-icons">
        <!-- Signal -->
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor">
          <rect x="0" y="8" width="3" height="4" rx="0.5" opacity="0.35"/>
          <rect x="4.5" y="5.5" width="3" height="6.5" rx="0.5" opacity="0.35"/>
          <rect x="9" y="3" width="3" height="9" rx="0.5"/>
          <rect x="13.5" y="0" width="3" height="12" rx="0.5"/>
        </svg>
        <!-- WiFi -->
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
          <path d="M8 9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/>
          <path d="M8 6C6.1 6 4.4 6.8 3.2 8.1L2 6.9C3.5 5.3 5.6 4.3 8 4.3s4.5 1 6 2.6l-1.2 1.2C11.6 6.8 9.9 6 8 6z" opacity="0.6"/>
          <path d="M8 2.5C5 2.5 2.4 3.9.5 6.1L-.8 4.9C1.4 2.3 4.5.7 8 .7s6.6 1.6 8.8 4.2l-1.3 1.2C13.6 3.9 11 2.5 8 2.5z" opacity="0.35"/>
        </svg>
        <!-- Battery -->

      <div class="pulse-dot playing" id="pulseDot"></div>

      <div class="track-info">
        <div class="track-name-wrap">
          <span class="track-name" id="trackName">Lose Yourself</span>
        </div>
        <div class="track-meta">
          <span class="track-artist" id="trackArtist">Eminem</span>
          <span class="bpm-badge" id="trackBpm">171 BPM</span>
        </div>
      </div>

      <div class="np-controls">
        <!-- Play/pause -->
        <button class="btn-play" id="playBtn" aria-label="Play / Pause">
          <svg id="playIcon" width="16" height="18" viewBox="0 0 16 18" fill="none">
            <path d="M2 1.5l12 7-12 7V1.5z" fill="#04201b"/>
          </svg>
        </button>

        <!-- Skip with ring -->
        <div class="skip-wrap" id="skipWrap">
          <svg class="skip-ring-svg" viewBox="0 0 46 46">
            <circle class="skip-ring-track" cx="23" cy="23" r="20"/>
            <circle class="skip-ring-fill" id="skipRing" cx="23" cy="23" r="20"/>
          </svg>
          <div class="skip-flash" id="skipFlash"></div>
          <div class="skip-inner">
            <span class="skip-icon">⏭</span>
            <span class="skip-label">SKIP</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Workspace -->
    <div class="workspace">
      <!-- Tab bar -->
      <div class="tab-bar">
        <button class="tab-btn active" id="tabQueue">Queue</button>
        <button class="tab-btn" id="tabLibrary">Library</button>
      </div>

      <!-- Tab panels -->
      <div class="tab-panels">

        <!-- Queue panel -->
        <div class="tab-panel active" id="panelQueue">
          <div class="queue-header">
            <span class="queue-title">Up Next</span>
            <span class="count-badge" id="queueCount">5 tracks</span>
            <button class="automix-btn on" id="automixBtn">
              <span class="automix-dot"></span>
              <span id="automixLabel">Automix</span>
            </button>
            <button class="clear-btn" id="clearBtn">Clear</button>
          </div>

          <div class="queue-list" id="queueList"></div>
          <div class="queue-empty" id="queueEmpty">
            <div class="empty-icon">🎵</div>
            <div class="empty-text">Queue is empty<br>Add tracks from Library</div>
          </div>

          <!-- FAB -->
          <button class="fab" id="fabLibrary">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
              <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Library
          </button>
        </div>

        <!-- Library panel -->
        <div class="tab-panel" id="panelLibrary">
          <div class="library-search-wrap">
            <div class="library-search-rel">
              <input
                class="library-search"
                id="librarySearch"
                type="search"
                placeholder="Search tracks…"
                autocomplete="off"
                spellcheck="false"
              >
              <span class="search-icon-wrap">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                  <circle cx="6" cy="6" r="4.5"/>
                  <path d="M9.5 9.5l2.5 2.5"/>
                </svg>
              </span>
            </div>
          </div>
          <div class="library-list" id="libraryList"></div>
          <div class="lib-no-results" id="libraryEmpty">No tracks found</div>
        </div>

      </div>

      <!-- Toast container -->
      <div class="toast-container" id="toastContainer"></div>
    </div>

    <!-- Home indicator -->
    <div class="home-indicator">
      <div class="home-bar"></div>
    </div>

  </div><!-- /screen -->
</div><!-- /phone-frame -->

<script>
/* ─── Data ─── */
const QUEUE_INIT = [
  { id: 1, name: 'HUMBLE.',         artist: 'Kendrick Lamar', bpm: 150 },
  { id: 2, name: 'God\'s Plan',     artist: 'Drake',          bpm: 77  },
  { id: 3, name: 'SICKO MODE',      artist: 'Travis Scott',   bpm: 155 },
  { id: 4, name: 'Old Town Road',   artist: 'Lil Nas X',      bpm: 136 },
  { id: 5, name: 'Blinding Lights', artist: 'The Weeknd',     bpm: 171 },
];

const LIBRARY = [
  { id: 101, name: 'Lose Yourself',         artist: 'Eminem',            bpm: 171 },
  { id: 102, name: 'HUMBLE.',               artist: 'Kendrick Lamar',    bpm: 150 },
  { id: 103, name: 'God\'s Plan',           artist: 'Drake',             bpm: 77  },
  { id: 104, name: 'SICKO MODE',            artist: 'Travis Scott',      bpm: 155 },
  { id: 105, name: 'Old Town Road',         artist: 'Lil Nas X',         bpm: 136 },
  { id: 106, name: 'Blinding Lights',       artist: 'The Weeknd',        bpm: 171 },
  { id: 107, name: 'Shape of You',          artist: 'Ed Sheeran',        bpm: 96  },
  { id: 108, name: 'Rolling in the Deep',   artist: 'Adele',             bpm: 105 },
  { id: 109, name: 'One Dance',             artist: 'Drake',             bpm: 104 },
  { id: 110, name: 'Uptown Funk',           artist: 'Mark Ronson',       bpm: 115 },
  { id: 111, name: 'Levitating',            artist: 'Dua Lipa',          bpm: 103 },
  { id: 112, name: 'Bad Guy',               artist: 'Billie Eilish',     bpm: 135 },
];

/* ─── State ─── */
let queue = QUEUE_INIT.map(t => ({ ...t }));
let isPlaying = true;
let automixOn = true;
let nextId = 200;

/* ─── DOM refs ─── */
const pulseDot    = document.getElementById('pulseDot');
const playBtn     = document.getElementById('playBtn');
const playIcon    = document.getElementById('playIcon');
const trackName   = document.getElementById('trackName');
const skipWrap    = document.getElementById('skipWrap');
const skipRing    = document.getElementById('skipRing');
const skipFlash   = document.getElementById('skipFlash');
const automixBtn  = document.getElementById('automixBtn');
const automixLbl  = document.getElementById('automixLabel');
const queueList   = document.getElementById('queueList');
const queueCount  = document.getElementById('queueCount');
const queueEmpty  = document.getElementById('queueEmpty');
const clearBtn    = document.getElementById('clearBtn');
const fabLibrary  = document.getElementById('fabLibrary');
const tabQueue    = document.getElementById('tabQueue');
const tabLibrary  = document.getElementById('tabLibrary');
const panelQueue  = document.getElementById('panelQueue');
const panelLib    = document.getElementById('panelLibrary');
const libSearch   = document.getElementById('librarySearch');
const libList     = document.getElementById('libraryList');
const libEmpty    = document.getElementById('libraryEmpty');
const toastCont   = document.getElementById('toastContainer');

/* ─── SVG icons ─── */
const ICON_PLAY  = `<path d="M2 1.5l12 7-12 7V1.5z" fill="#04201b"/>`;
const ICON_PAUSE = `<rect x="2" y="2" width="4" height="14" rx="1.5" fill="#04201b"/><rect x="10" y="2" width="4" height="14" rx="1.5" fill="#04201b"/>`;

function setPlayIcon(playing) {
  playIcon.innerHTML = playing ? ICON_PLAY : ICON_PAUSE;
  if (playing) {
    playIcon.setAttribute('viewBox', '0 0 16 18');
    playIcon.setAttribute('width', '16');
    playIcon.setAttribute('height', '18');
  } else {
    playIcon.setAttribute('viewBox', '0 0 16 18');
    playIcon.setAttribute('width', '16');
    playIcon.setAttribute('height', '18');
  }
}

/* ─── Play / Pause ─── */
playBtn.addEventListener('click', () => {
  isPlaying = !isPlaying;
  setPlayIcon(isPlaying);
  if (isPlaying) {
    pulseDot.classList.remove('paused');
    pulseDot.classList.add('playing');
    trackName.classList.remove('paused-anim');
  } else {
    pulseDot.classList.remove('playing');
    pulseDot.classList.add('paused');
    trackName.classList.add('paused-anim');
  }
});

/* ─── Long-press skip (700 ms) ─── */
const SKIP_DURATION = 700;
const CIRCUMFERENCE = 2 * Math.PI * 20; // 125.66
let skipTimer = null;
let skipStart = null;
let skipRAF   = null;

function updateRing(progress) {
  // progress 0→1
  const offset = CIRCUMFERENCE * (1 - progress);
  skipRing.style.strokeDashoffset = offset;
}

function tickRing() {
  const elapsed = Date.now() - skipStart;
  const p = Math.min(elapsed / SKIP_DURATION, 1);
  updateRing(p);
  if (p < 1) {
    skipRAF = requestAnimationFrame(tickRing);
  } else {
    fireSkip();
  }
}

function startSkip(e) {
  e.preventDefault();
  skipStart = Date.now();
  skipRAF = requestAnimationFrame(tickRing);
}

function cancelSkip() {
  if (skipRAF) { cancelAnimationFrame(skipRAF); skipRAF = null; }
  skipStart = null;
  updateRing(0);
}

function fireSkip() {
  cancelAnimationFrame(skipRAF); skipRAF = null;
  updateRing(0);
  // Flash
  skipFlash.classList.remove('flash-anim');
  void skipFlash.offsetWidth;
  skipFlash.classList.add('flash-anim');
  // Advance queue
  if (queue.length > 0) {
    const next = queue.shift();
    trackName.textContent = next.name;
    document.getElementById('trackArtist').textContent = next.artist;
    document.getElementById('trackBpm').textContent = next.bpm + ' BPM';
    renderQueue();
  }
  if (!isPlaying) {
    isPlaying = true;
    setPlayIcon(true);
    pulseDot.classList.remove('paused');
    pulseDot.classList.add('playing');
    trackName.classList.remove('paused-anim');
  }
}

skipWrap.addEventListener('mousedown',   startSkip);
skipWrap.addEventListener('touchstart',  startSkip, { passive: false });
skipWrap.addEventListener('mouseup',     cancelSkip);
skipWrap.addEventListener('mouseleave',  cancelSkip);
skipWrap.addEventListener('touchend',    cancelSkip);
skipWrap.addEventListener('touchcancel', cancelSkip);

/* ─── Automix toggle ─── */
automixBtn.addEventListener('click', () => {
  automixOn = !automixOn;
  automixBtn.classList.toggle('on', automixOn);
  automixLbl.textContent = automixOn ? 'Automix' : 'Manual';
});

/* ─── Clear queue ─── */
clearBtn.addEventListener('click', () => {
  queue = [];
  renderQueue();
});

/* ─── Queue rendering ─── */
function renderQueue() {
  queueList.innerHTML = '';
  const n = queue.length;
  const label = n === 1 ? '1 track' : `${n} tracks`;
  queueCount.textContent = label;

  if (n === 0) {
    queueEmpty.classList.add('visible');
    return;
  }
  queueEmpty.classList.remove('visible');

  queue.forEach((track, i) => {
    const item = document.createElement('div');
    item.className = 'queue-item';
    item.dataset.id = track.id;
    item.innerHTML = `
      <span class="queue-num">${i + 1}</span>
      <div class="queue-item-info">
        <div class="queue-item-name">${esc(track.name)}</div>
        <div class="queue-item-bpm">${esc(track.artist)} · ${track.bpm} BPM</div>
      </div>
      <span class="drag-handle">⠿</span>
      <button class="remove-btn" data-id="${track.id}" aria-label="Remove">×</button>
    `;
    queueList.appendChild(item);
  });

  queueList.querySelectorAll('.remove-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = parseInt(btn.dataset.id, 10);
      const item = btn.closest('.queue-item');
      item.classList.add('removing');
      setTimeout(() => {
        queue = queue.filter(t => t.id !== id);
        renderQueue();
      }, 200);
    });
  });
}

/* ─── Library rendering ─── */
function renderLibrary(filter = '') {
  const q = filter.trim().toLowerCase();
  const visible = q
    ? LIBRARY.filter(t =>
        t.name.toLowerCase().includes(q) ||
        t.artist.toLowerCase().includes(q)
      )
    : LIBRARY;

  libList.innerHTML = '';
  if (visible.length === 0) {
    libEmpty.classList.add('visible');
    return;
  }
  libEmpty.classList.remove('visible');

  visible.forEach(track => {
    const inQueue = queue.some(t => t.name === track.name && t.artist === track.artist);
    const item = document.createElement('div');
    item.className = 'lib-item';
    item.innerHTML = `
      <div class="lib-item-info">
        <div class="lib-item-name">${esc(track.name)}</div>
        <div class="lib-item-meta">${esc(track.artist)} · ${track.bpm} BPM</div>
      </div>
      <button class="add-queue-btn ${inQueue ? 'added' : ''}" data-id="${track.id}">
        ${inQueue ? '✓ Added' : '+ Queue'}
      </button>
    `;
    libList.appendChild(item);
  });

  libList.querySelectorAll('.add-queue-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = parseInt(btn.dataset.id, 10);
      const track = LIBRARY.find(t => t.id === id);
      if (!track) return;
      const alreadyIn = queue.some(t => t.name === track.name && t.artist === track.artist);
      if (!alreadyIn) {
        queue.push({ ...track, id: nextId++ });
        renderQueue();
        renderLibrary(libSearch.value);
        showToast(`"${track.name}" added to queue`);
      } else {
        showToast(`Already in queue`);
      }
    });
  });
}

/* ─── Search ─── */
libSearch.addEventListener('input', () => renderLibrary(libSearch.value));

/* ─── Tabs ─── */
function switchTab(to) {
  const isQueue = to === 'queue';
  tabQueue.classList.toggle('active', isQueue);
  tabLibrary.classList.toggle('active', !isQueue);
  panelQueue.classList.toggle('active', isQueue);
  panelLib.classList.toggle('active', !isQueue);
}

tabQueue.addEventListener('click',   () => switchTab('queue'));
tabLibrary.addEventListener('click', () => switchTab('library'));
fabLibrary.addEventListener('click', () => switchTab('library'));

/* ─── Toast ─── */
function showToast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="toast-dot"></span>${esc(msg)}`;
  toastCont.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

/* ─── Helpers ─── */
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ─── Init ─── */
setPlayIcon(isPlaying);
renderQueue();
renderLibrary();
</script>
</body>
</html>
